[package]
name = "glasshouse-py"
description = "PyO3 bindings for glasshouse. Thin by rule: no logic lives here."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
glasshouse-core = { path = "../core" }
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["extension-module"] }

[lints]
workspace = true
