[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "glasshouse"
version = "0.0.1"
description = "Interpretable, well-rounded ML: glass-box models and metrics that tell the truth. Rust core, Python API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Matkicail" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# research models (torch) come later, behind this extra, so the core install stays light.
research = []

[project.urls]
Repository = "https://github.com/Matkicail/glasshouse"

[tool.maturin]
python-source = "python"
module-name = "glasshouse._core"
manifest-path = "crates/py/Cargo.toml"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "scikit-learn>=1.5",
  "ruff>=0.6",
  "mypy>=1.11",
  "maturin>=1.9,<2",
  "pandas>=3.0.5",
  "polars>=1.44.1",
  "pyarrow>=25.0.1",
]

[tool.uv]
# rebuild the Rust extension whenever the crates change
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D", "C90", "PL", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 8
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["python", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "python"]
addopts = "-q --doctest-modules"
