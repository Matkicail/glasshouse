name: report

# The TypeScript report viewer: build must reproduce the checked-in dist, tests must pass on the
# Python-produced fixture, the bundle must stay inside its size budget, and every JS
# dependency is scanned (npm audit + OSV). Pinned by SHA like ci.yml.

on:
  push:
    branches: [main]
    paths: ["report/**", "tests/fixtures/**", ".github/workflows/report.yml"]
  pull_request:
    paths: ["report/**", "tests/fixtures/**", ".github/workflows/report.yml"]

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: report/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: checked-in build must match a fresh build
        run: git diff --exit-code -- dist
      - run: npm test
      - run: npm run size
      - run: npm audit --audit-level=high

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=report/package-lock.json
            --lockfile=Cargo.lock
            --lockfile=uv.lock
