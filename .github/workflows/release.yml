name: release

# Tag vX.Y.Z on main and this builds the wheels (Linux, macOS, Windows; 3.12 and 3.13 via
# abi3-less builds per interpreter) plus the sdist, then publishes them to PyPI through
# Trusted Publishing: the job proves its identity to PyPI with an OIDC token minted by
# GitHub, so there is no API token anywhere in this repo. A pre-release tag (v0.2.0rc1) goes
# to TestPyPI instead; pre-releases are always rcN, so one substring test tells them apart.
# One-time setup on PyPI: add a "pending publisher" for this repo, workflow `release.yml`,
# environment `pypi` (and `testpypi` on test.pypi.org); then create both environments in the
# repo's Settings -> Environments.
#
# Every action is pinned to a commit SHA resolved from GitHub (git ls-remote), never from
# memory; the comment after each SHA is the tag it was resolved from.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: the tag must match the version in pyproject.toml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project --with tomli python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then echo "tag v$tag but pyproject says $version"; exit 1; fi
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist --interpreter 3.12 3.13
          manylinux: auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # an rc tag (v0.2.0rc1) is a pre-release and goes to TestPyPI; everything else to PyPI
    environment: ${{ contains(github.ref_name, 'rc') && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # Trusted Publishing: mint the OIDC token PyPI checks
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: publish to TestPyPI (pre-release tag)
        if: contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: publish to PyPI
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
