<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glasshouse report</title>
<style>
  :root { --ink: #1a1a1a; --muted: #6b6b6b; --line: #e6e6e6; --accent: #0072B2; --bg: #ffffff; --best: #eef5fb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 32px 48px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); max-width: 1280px; margin-inline: auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  h3 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .lede { margin: 14px 0 10px; }
  .caption { color: var(--muted); font-size: 12px; margin: 6px 0 14px; }
  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 12px; }
  nav.tabs button { border: 0; background: none; padding: 8px 12px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  table.grid { border-collapse: collapse; font-variant-numeric: tabular-nums; width: auto; }
  table.grid th, table.grid td { padding: 5px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.grid thead th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--ink); }
  table.grid tbody th { font-weight: 500; }
  table.grid td.num { text-align: right; }
  table.grid td.best { font-weight: 700; background: var(--best); }
  table.grid tr.primary th { font-weight: 700; }
  .tick { display: inline-block; width: 1.4em; text-align: right; font-size: 11px; }
  .tick.yes { color: #009E73; } .tick.no { color: #D55E00; } .tick.tie, .tick.- { color: var(--muted); }
  .controls { margin: 4px 0 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .toggles label { margin-right: 12px; cursor: pointer; }
  .charts.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .charts.two { grid-template-columns: 1fr; } }
  .chart { min-height: 120px; }
  .chart-body { min-height: 360px; }
  .chart-title { margin-top: 12px; }
  .provenance pre { white-space: pre-wrap; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: #f7f7f7; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--line); }
  footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 10px; }
  @media print { nav.tabs, footer { display: none; } section[hidden] { display: block !important; } }
</style>
<!-- Plotly from a pinned CDN with an integrity hash. If it cannot load, charts fall back to tables. -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" integrity="__GLASSHOUSE_PLOTLY_SRI__" crossorigin="anonymous"></script>
</head>
<body>
<div id="report" aria-live="polite"><p class="muted">Loading report…</p></div>
<script id="glasshouse-report-data" type="application/json">__GLASSHOUSE_REPORT_JSON__</script>
<script>
__GLASSHOUSE_REPORT_JS__
</script>
<script>
(function () {
  var root = document.getElementById("report");
  try {
    var text = document.getElementById("glasshouse-report-data").textContent;
    var doc = GlasshouseReport.parse(text);
    GlasshouseReport.render(doc, root);
  } catch (err) {
    root.textContent = "";
    var p = document.createElement("p");
    p.textContent = "This report could not be rendered: " + (err && err.message ? err.message : String(err));
    root.appendChild(p);
  }
})();
</script>
</body>
</html>
